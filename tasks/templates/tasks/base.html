<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}TaskFlow{% endblock %}</title>
<style>
:root{--bg:#f3f5f2;--surface:#fff;--ink:#17211d;--muted:#5d6b65;--line:#dbe1dc;--accent:#1f6f5c;--accent-ink:#fff;--high:#c2410c}
@media (prefers-color-scheme:dark){:root{--bg:#101614;--surface:#18211e;--ink:#e8efeb;--muted:#93a39b;--line:#2a3733;--accent:#4fb89d;--accent-ink:#06130f;--high:#f08a5d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,button{font:inherit;color:inherit}
input{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:.55rem .7rem;width:100%}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:.55rem 1rem;font-weight:600;cursor:pointer}
.btn.ghost{background:none;color:var(--muted);border:1px solid var(--line)}
.auth{max-width:380px;margin:12vh auto;padding:0 1rem}
.auth h1{font-size:1.9rem;letter-spacing:-.02em;margin:0 0 .3rem}
.auth form{display:grid;gap:.8rem;margin-top:1.4rem}
.auth form p{margin:0;display:grid;gap:.25rem;font-weight:500}
.auth .helptext{color:var(--muted);font-size:.85rem;font-weight:400}
.auth .errorlist{color:var(--high);font-size:.85rem;margin:0;padding-left:1rem}
</style>
{% block head %}{% endblock %}
</head>
<body>{% block body %}{% endblock %}</body>
</html>
