{% extends "tasks/base.html" %}
{% block title %}Board · TaskFlow{% endblock %}
{% block head %}
<style>
header{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1rem clamp(1rem,4vw,2.5rem);border-bottom:1px solid var(--line)}
header b{font-size:1.2rem;letter-spacing:-.02em}
header form{display:flex;gap:.7rem;align-items:center;color:var(--muted)}
main{padding:1.5rem clamp(1rem,4vw,2.5rem);max-width:1200px;margin:auto}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;align-items:start}
.col{background:color-mix(in srgb,var(--surface) 55%,transparent);border:1px dashed var(--line);border-radius:10px;padding:.8rem;min-height:140px}
.col h2{font-size:.95rem;margin:.1rem .2rem .7rem;display:flex;justify-content:space-between}
.col h2 span{color:var(--muted);font-weight:400}
.card{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:8px;padding:.6rem .7rem;margin-bottom:.6rem}
.card.high{border-left-color:var(--high)}
.card.medium{border-left-color:#b7791f}
.card.low{border-left-color:var(--accent)}
.meta{display:flex;align-items:center;gap:.4rem;font-size:.82rem;color:var(--muted)}
.meta .late{color:var(--high);font-weight:600}
.meta .sp{flex:1}
.meta button{background:none;border:0;color:var(--muted);cursor:pointer;padding:.15rem .4rem;border-radius:6px}
.meta button:hover{background:var(--bg);color:var(--ink)}
.card p{margin:0 0 .4rem;overflow-wrap:anywhere}
.empty{color:var(--muted);font-size:.9rem;padding:.4rem .2rem}
#err{color:var(--high);min-height:1.4em;margin-bottom:.6rem}
.add{display:grid;grid-template-columns:1fr 130px 150px auto;gap:.6rem;margin-bottom:1rem}
select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:.55rem .7rem;width:100%;font:inherit;color:inherit}
.card{cursor:grab}
.card.dragging{opacity:.4}
.col.over{border-color:var(--accent);background:var(--surface)}
@media (max-width:820px){.cols{grid-template-columns:1fr}.add{grid-template-columns:1fr 1fr}.add input:first-child{grid-column:1/-1}}</style>
{% endblock %}
{% block body %}
<header>
  <b>TaskFlow</b>
  <form method="post" action="{% url 'logout' %}">{% csrf_token %}{{ request.user.username }}
    <button class="btn ghost" type="submit">Log out</button>
  </form>
</header>
<main>
    <form class="add" id="add">
    <input name="title" placeholder="What needs doing?" maxlength="140" required aria-label="Task title">
    <select name="priority" aria-label="Priority">
      <option value="low">Low</option>
      <option value="medium" selected>Medium</option>
      <option value="high">High</option>
    </select>
    <input name="due_date" type="date" aria-label="Due date">
    <button class="btn" type="submit">Add task</button>
  </form>
  <div id="err" role="alert"></div>
  <div class="cols" id="cols"></div>
</main>
<script>
const COLS = [["todo", "To do"], ["doing", "In progress"], ["done", "Done"]];
const $ = s => document.querySelector(s);
let tasks = [];

function csrf() {
  return document.cookie.split("; ").find(c => c.startsWith("csrftoken=")).split("=")[1];
}

async function api(url, method = "GET", body) {
  const r = await fetch(url, {
    method,
    headers: {"Content-Type": "application/json", "X-CSRFToken": csrf()},
    body: body && JSON.stringify(body),
  });
  const data = r.status === 204 ? {} : await r.json();
  if (!r.ok) throw new Error(data.error || "Something went wrong. Try again.");
  return data;
}

async function load() {
  try {
    const r = await fetch("/api/tasks/");
    if (!r.ok) throw new Error("Could not load tasks.");
    tasks = (await r.json()).tasks;
    draw();
  } catch (e) {
    $("#err").textContent = e.message;
  }
}

function esc(text) {
  const d = document.createElement("div");
  d.textContent = text;
  return d.innerHTML;
}

function draw() {
  const today = new Date().toISOString().slice(0, 10);
    $("#cols").innerHTML = COLS.map(([key, label], i) => {
    const items = tasks.filter(t => t.status === key);
    const cards = items.map(t => `
          <article class="card ${t.priority}" data-id="${t.id}" draggable="true">
        <p>${esc(t.title)}</p>
                <div class="meta">
          <span>${t.priority}</span>
          ${t.due_date ? `<span class="${t.due_date < today && key !== "done" ? "late" : ""}">${t.due_date}</span>` : ""}
          <span class="sp"></span>
          ${i > 0 ? `<button data-move="${COLS[i-1][0]}" aria-label="Move to ${COLS[i-1][1]}">←</button>` : ""}
          ${i < 2 ? `<button data-move="${COLS[i+1][0]}" aria-label="Move to ${COLS[i+1][1]}">→</button>` : ""}
          <button data-del aria-label="Delete task">✕</button>
        </div>
      </article>`).join("");
    return `<section class="col" data-status="${key}">
      <h2>${label}<span>${items.length}</span></h2>
      ${cards || '<div class="empty">No tasks yet.</div>'}
    </section>`;
  }).join("");
}

$("#add").addEventListener("submit", async e => {
  e.preventDefault();
  $("#err").textContent = "";
  try {
    await api("/api/tasks/", "POST", Object.fromEntries(new FormData(e.target)));
    e.target.reset();
    await load();
  } catch (err) {
    $("#err").textContent = err.message;
  }
});

$("#cols").addEventListener("click", async e => {
  const card = e.target.closest(".card");
  if (!card) return;
  $("#err").textContent = "";
  try {
    const url = `/api/tasks/${card.dataset.id}/`;
    if (e.target.dataset.move) await api(url, "PATCH", {status: e.target.dataset.move});
    else if (e.target.hasAttribute("data-del")) await api(url, "DELETE");
    else return;
    await load();
  } catch (err) {
    $("#err").textContent = err.message;
  }
});

let dragId = null;
const colsEl = $("#cols");

colsEl.addEventListener("dragstart", e => {
  const card = e.target.closest(".card");
  if (!card) return;
  dragId = card.dataset.id;
  card.classList.add("dragging");
});

colsEl.addEventListener("dragend", () => {
  document.querySelectorAll(".dragging, .over").forEach(el => el.classList.remove("dragging", "over"));
});

colsEl.addEventListener("dragover", e => {
  const col = e.target.closest(".col");
  if (col) {
    e.preventDefault();
    col.classList.add("over");
  }
});

colsEl.addEventListener("dragleave", e => {
  const col = e.target.closest(".col");
  if (col && !col.contains(e.relatedTarget)) col.classList.remove("over");
});

colsEl.addEventListener("drop", async e => {
  const col = e.target.closest(".col");
  if (!col || !dragId) return;
  e.preventDefault();
  try {
    await api(`/api/tasks/${dragId}/`, "PATCH", {status: col.dataset.status});
    await load();
  } catch (err) {
    $("#err").textContent = err.message;
  }
  dragId = null;
});

load();
</script>
{% endblock %}
