{% extends "tasks/base.html" %}
{% block title %}Board · TaskFlow{% endblock %}
{% block head %}
<style>
header{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1rem clamp(1rem,4vw,2.5rem);border-bottom:1px solid var(--line)}
header b{font-size:1.2rem;letter-spacing:-.02em}
header form{display:flex;gap:.7rem;align-items:center;color:var(--muted)}
main{padding:1.5rem clamp(1rem,4vw,2.5rem);max-width:1200px;margin:auto}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;align-items:start}
.col{background:color-mix(in srgb,var(--surface) 55%,transparent);border:1px dashed var(--line);border-radius:10px;padding:.8rem;min-height:140px}
.col h2{font-size:.95rem;margin:.1rem .2rem .7rem;display:flex;justify-content:space-between}
.col h2 span{color:var(--muted);font-weight:400}
.card{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:8px;padding:.6rem .7rem;margin-bottom:.6rem}
.card.high{border-left-color:var(--high)}
.card.medium{border-left-color:#b7791f}
.card.low{border-left-color:var(--accent)}
.card p{margin:0 0 .4rem;overflow-wrap:anywhere}
.meta{display:flex;gap:.6rem;font-size:.82rem;color:var(--muted)}
.empty{color:var(--muted);font-size:.9rem;padding:.4rem .2rem}
#err{color:var(--high);min-height:1.4em;margin-bottom:.6rem}
@media (max-width:820px){.cols{grid-template-columns:1fr}}
</style>
{% endblock %}
{% block body %}
<header>
  <b>TaskFlow</b>
  <form method="post" action="{% url 'logout' %}">{% csrf_token %}{{ request.user.username }}
    <button class="btn ghost" type="submit">Log out</button>
  </form>
</header>
<main>
  <div id="err" role="alert"></div>
  <div class="cols" id="cols"></div>
</main>
<script>
const COLS = [["todo", "To do"], ["doing", "In progress"], ["done", "Done"]];
const $ = s => document.querySelector(s);
let tasks = [];

async function load() {
  try {
    const r = await fetch("/api/tasks/");
    if (!r.ok) throw new Error("Could not load tasks.");
    tasks = (await r.json()).tasks;
    draw();
  } catch (e) {
    $("#err").textContent = e.message;
  }
}

function esc(text) {
  const d = document.createElement("div");
  d.textContent = text;
  return d.innerHTML;
}

function draw() {
  const today = new Date().toISOString().slice(0, 10);
  $("#cols").innerHTML = COLS.map(([key, label]) => {
    const items = tasks.filter(t => t.status === key);
    const cards = items.map(t => `
      <article class="card ${t.priority}" data-id="${t.id}">
        <p>${esc(t.title)}</p>
        <div class="meta">
          <span>${t.priority}</span>
          ${t.due_date ? `<span>${t.due_date}</span>` : ""}
        </div>
      </article>`).join("");
    return `<section class="col" data-status="${key}">
      <h2>${label}<span>${items.length}</span></h2>
      ${cards || '<div class="empty">No tasks yet.</div>'}
    </section>`;
  }).join("");
}

load();
</script>
{% endblock %}
