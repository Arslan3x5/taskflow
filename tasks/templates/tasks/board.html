{% extends "tasks/base.html" %}
{% block title %}Board · TaskFlow{% endblock %}
{% block head %}
<style>
:root{--doing:#b7791f;--shadow:0 1px 2px rgba(23,33,29,.06),0 6px 18px rgba(23,33,29,.06)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--doing:#e0a93c;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.28)}}
:root[data-theme=dark]{--doing:#e0a93c;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.28)}

body{min-height:100vh;background:
  radial-gradient(900px 420px at 88% -8%,color-mix(in srgb,var(--accent) 16%,transparent),transparent),
  radial-gradient(700px 380px at -5% 10%,color-mix(in srgb,var(--doing) 10%,transparent),transparent),
  var(--bg)}

/* Header */
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.8rem clamp(1rem,4vw,2.5rem);border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--surface) 78%,transparent);backdrop-filter:blur(12px)}
header b{display:flex;align-items:center;gap:.55rem;font-size:1.2rem;letter-spacing:-.03em}
header b::before{content:"";width:.85rem;height:.85rem;border-radius:4px;transform:rotate(45deg);background:linear-gradient(135deg,var(--accent),var(--doing))}
header form{display:flex;align-items:center;gap:.7rem}
.who{display:flex;align-items:center;gap:.5rem;color:var(--muted);font-size:.92rem}
.who i{display:grid;place-items:center;width:1.9rem;height:1.9rem;border-radius:50%;font-style:normal;font-weight:700;font-size:.85rem;background:var(--accent);color:var(--accent-ink)}
.icon{padding:.5rem .7rem;line-height:1;font-size:1rem}

main{max-width:1200px;margin:auto;padding:1.75rem clamp(1rem,4vw,2.5rem) 3rem}
.hello h1{margin:0;font-size:clamp(1.6rem,3vw,2.1rem);letter-spacing:-.03em}
.hello p{margin:.2rem 0 1.4rem;color:var(--muted)}

/* Stats */
#stats{display:grid;grid-template-columns:repeat(4,1fr);gap:.8rem;margin-bottom:1.2rem}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:.85rem 1rem;box-shadow:var(--shadow)}
.stat strong{display:block;font-size:1.9rem;line-height:1.1;letter-spacing:-.03em}
.stat span{color:var(--muted);font-size:.85rem}
.stat.warn strong{color:var(--high)}
.progress{grid-column:1/-1;display:flex;align-items:center;gap:.8rem;color:var(--muted);font-size:.85rem}
.progress div{flex:1;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.progress div i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--doing));transition:width .4s ease}

/* Add form */
.add{display:grid;grid-template-columns:1fr 130px 150px auto;gap:.6rem;margin-bottom:1rem;padding:.7rem;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.add input,.add select{border-radius:10px}
select{width:100%;padding:.55rem .7rem;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:10px}
input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.btn{transition:transform .15s,filter .15s}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
#err{min-height:1.4em;margin:0 0 .6rem;color:var(--high);font-weight:500}

/* Columns */
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:1.1rem;align-items:start}
.col{min-height:200px;padding:.9rem;border:1px solid var(--line);border-radius:16px;background:color-mix(in srgb,var(--surface) 45%,transparent);transition:border-color .2s,background .2s,box-shadow .2s}
.col.over{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.col h2{display:flex;align-items:center;gap:.5rem;margin:.1rem .2rem .9rem;font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.col h2::before{content:"";width:.55rem;height:.55rem;border-radius:50%;background:var(--muted)}
.col[data-status=doing] h2::before{background:var(--doing)}
.col[data-status=done] h2::before{background:var(--accent)}
.col h2 span{margin-left:auto;padding:0 .55rem;border-radius:99px;font-size:.75rem;letter-spacing:0;color:var(--ink);background:var(--line)}

/* Cards */
.card{margin-bottom:.7rem;padding:.75rem .85rem;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);cursor:grab;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.card:active{cursor:grabbing}
.card.dragging{opacity:.35;transform:rotate(1.5deg)}
.card p{margin:0 0 .55rem;font-weight:500;overflow-wrap:anywhere}
.col[data-status=done] .card p{color:var(--muted);text-decoration:line-through}
.meta{display:flex;align-items:center;gap:.4rem;font-size:.8rem;color:var(--muted)}
.pill{padding:.05rem .6rem;border-radius:99px;font-weight:600;text-transform:capitalize;background:color-mix(in srgb,var(--muted) 15%,transparent)}
.card.high .pill{color:var(--high);background:color-mix(in srgb,var(--high) 16%,transparent)}
.card.medium .pill{color:var(--doing);background:color-mix(in srgb,var(--doing) 18%,transparent)}
.card.low .pill{color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,transparent)}
.late{color:var(--high);font-weight:600}
.sp{flex:1}
.meta button{padding:.2rem .45rem;border:0;border-radius:7px;background:none;color:var(--muted);cursor:pointer;transition:background .15s,color .15s}
.meta button:hover{background:var(--bg);color:var(--ink)}
.meta button[data-del]:hover{color:var(--high)}
.empty{padding:1.4rem .5rem;text-align:center;color:var(--muted);font-size:.88rem;border:1px dashed var(--line);border-radius:10px}

@media (prefers-reduced-motion:no-preference){.card{animation:rise .25s ease both}@keyframes rise{from{opacity:0;transform:translateY(6px)}}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:820px){
  .cols{grid-template-columns:1fr}
  #stats{grid-template-columns:1fr 1fr}
  .add{grid-template-columns:1fr 1fr}
  .add input:first-child{grid-column:1/-1}
  .who span{display:none}
}
</style>
{% endblock %}

{% block body %}
<header>
  <b>TaskFlow</b>
  <form method="post" action="{% url 'logout' %}">{% csrf_token %}
    <div class="who"><i>{{ request.user.username|slice:":1"|upper }}</i><span>{{ request.user.username }}</span></div>
    <button class="btn ghost icon" type="button" id="theme" aria-label="Switch between light and dark mode">🌙</button>
    <button class="btn ghost" type="submit">Log out</button>
  </form>
</header>

<main>
  <div class="hello">
    <h1 id="greeting">Your board</h1>
    <p id="sub"></p>
  </div>

  <section id="stats" aria-label="Summary"></section>

  <form class="add" id="add">
    <input name="title" placeholder="What needs doing?" maxlength="140" required aria-label="Task title">
    <select name="priority" aria-label="Priority">
      <option value="low">Low</option>
      <option value="medium" selected>Medium</option>
      <option value="high">High</option>
    </select>
    <input name="due_date" type="date" aria-label="Due date">
    <button class="btn" type="submit">Add task</button>
  </form>

  <div id="err" role="alert"></div>
  <div class="cols" id="cols"></div>
</main>

<script>
const COLS = [["todo", "To do"], ["doing", "In progress"], ["done", "Done"]];
const EMPTY = {todo: "Add your first task above.", doing: "Drag a task here to start it.", done: "Finished tasks land here."};
const $ = s => document.querySelector(s);
let tasks = [];
let stats = {total: 0, doing: 0, done: 0, overdue: 0, done_this_week: 0};

function csrf() {
  const c = document.cookie.split("; ").find(x => x.startsWith("csrftoken="));
  return c ? c.split("=")[1] : document.querySelector("[name=csrfmiddlewaretoken]").value;
}

async function api(url, method = "GET", body) {
  const r = await fetch(url, {
    method,
    headers: {"Content-Type": "application/json", "X-CSRFToken": csrf()},
    body: body && JSON.stringify(body),
  });
  const data = r.status === 204 ? {} : await r.json();
  if (!r.ok) throw new Error(data.error || "Something went wrong. Try again.");
  return data;
}

function esc(text) {
  const d = document.createElement("div");
  d.textContent = text;
  return d.innerHTML;
}

function today() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

function shortDate(iso) {
  return new Date(iso + "T00:00:00").toLocaleDateString(undefined, {month: "short", day: "numeric"});
}

async function load() {
  try {
    tasks = (await api("/api/tasks/")).tasks;
    stats = await api("/api/stats/");
    draw();
    drawStats();
  } catch (e) {
    $("#err").textContent = e.message;
  }
}

function drawStats() {
  const {total, doing, done, overdue, done_this_week} = stats;
  const pct = total ? Math.round(done / total * 100) : 0;
  const stat = (n, label, cls = "") => `<div class="stat ${cls}"><strong>${n}</strong><span>${label}</span></div>`;
  $("#stats").innerHTML =
    stat(total, "Total tasks") + stat(doing, "In progress") + stat(done_this_week, "Done this week") +
    stat(overdue, "Overdue", overdue ? "warn" : "") +
    `<div class="progress"><span>${pct}% complete</span><div><i style="width:${pct}%"></i></div></div>`;

  const h = new Date().getHours();
  $("#greeting").textContent = h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening";
  const open = total - done;
  $("#sub").textContent = total
    ? `${open} open ${open === 1 ? "task" : "tasks"}${overdue ? `, ${overdue} overdue` : ""}.`
    : "A clean slate. Add your first task below.";
}

function draw() {
  const t = today();
  $("#cols").innerHTML = COLS.map(([key, label], i) => {
    const items = tasks.filter(x => x.status === key);
    const cards = items.map(x => `
      <article class="card ${x.priority}" data-id="${x.id}" draggable="true">
        <p>${esc(x.title)}</p>
        <div class="meta">
          <span class="pill">${x.priority}</span>
          ${x.due_date ? `<span class="${x.due_date < t && key !== "done" ? "late" : ""}">${shortDate(x.due_date)}</span>` : ""}
          <span class="sp"></span>
          ${i > 0 ? `<button data-move="${COLS[i - 1][0]}" aria-label="Move to ${COLS[i - 1][1]}">←</button>` : ""}
          ${i < 2 ? `<button data-move="${COLS[i + 1][0]}" aria-label="Move to ${COLS[i + 1][1]}">→</button>` : ""}
          <button data-del aria-label="Delete task">✕</button>
        </div>
      </article>`).join("");
    return `<section class="col" data-status="${key}">
      <h2>${label}<span>${items.length}</span></h2>
      ${cards || `<div class="empty">${EMPTY[key]}</div>`}
    </section>`;
  }).join("");
}

/* Add a task */
$("#add").addEventListener("submit", async e => {
  e.preventDefault();
  $("#err").textContent = "";
  try {
    await api("/api/tasks/", "POST", Object.fromEntries(new FormData(e.target)));
    e.target.reset();
    await load();
  } catch (err) {
    $("#err").textContent = err.message;
  }
});

/* Move and delete buttons */
$("#cols").addEventListener("click", async e => {
  const btn = e.target.closest("button");
  const card = e.target.closest(".card");
  if (!btn || !card) return;
  $("#err").textContent = "";
  try {
    const url = `/api/tasks/${card.dataset.id}/`;
    if (btn.dataset.move) await api(url, "PATCH", {status: btn.dataset.move});
    else if (btn.hasAttribute("data-del")) await api(url, "DELETE");
    else return;
    await load();
  } catch (err) {
    $("#err").textContent = err.message;
  }
});

/* Drag and drop */
let dragId = null;
const colsEl = $("#cols");

colsEl.addEventListener("dragstart", e => {
  const card = e.target.closest(".card");
  if (!card) return;
  dragId = card.dataset.id;
  card.classList.add("dragging");
});

colsEl.addEventListener("dragend", () => {
  document.querySelectorAll(".dragging, .over").forEach(el => el.classList.remove("dragging", "over"));
});

colsEl.addEventListener("dragover", e => {
  const col = e.target.closest(".col");
  if (col) {
    e.preventDefault();
    col.classList.add("over");
  }
});

colsEl.addEventListener("dragleave", e => {
  const col = e.target.closest(".col");
  if (col && !col.contains(e.relatedTarget)) col.classList.remove("over");
});

colsEl.addEventListener("drop", async e => {
  const col = e.target.closest(".col");
  if (!col || !dragId) return;
  e.preventDefault();
  try {
    await api(`/api/tasks/${dragId}/`, "PATCH", {status: col.dataset.status});
    await load();
  } catch (err) {
    $("#err").textContent = err.message;
  }
  dragId = null;
});

/* Light / dark toggle */
const root = document.documentElement;
const isDark = () => root.dataset.theme
  ? root.dataset.theme === "dark"
  : matchMedia("(prefers-color-scheme: dark)").matches;
const themeIcon = () => $("#theme").textContent = isDark() ? "☀️" : "🌙";

$("#theme").addEventListener("click", () => {
  const next = isDark() ? "light" : "dark";
  root.dataset.theme = next;
  try { localStorage.setItem("theme", next); } catch (e) {}
  themeIcon();
});
themeIcon();

load();
</script>
{% endblock %}
