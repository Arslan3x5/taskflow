{% extends "tasks/base.html" %}
{% block title %}Log in · TaskFlow{% endblock %}
{% block body %}
<main class="auth">
  <h1>Welcome back</h1>
  <p style="color:var(--muted);margin:0">Log in to your board.</p>
  <form method="post">{% csrf_token %}
    {{ form.as_p }}
    <button class="btn" type="submit">Log in</button>
  </form>
  <p><a href="{% url 'register' %}">Create an account</a></p>
</main>
{% endblock %}
